version: "3.9"

networks:
  logisense-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logisense}
      POSTGRES_USER: ${POSTGRES_USER:-logisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logisense_secure_2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logisense-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logisense} -d ${POSTGRES_DB:-logisense}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2024}
    volumes:
      - redis-data:/data
    networks:
      - logisense-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-logisense_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secure_2024}
    volumes:
      - minio-data:/data
    networks:
      - logisense-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    networks:
      - logisense-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  simulator:
    build: ./simulator
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    networks:
      - logisense-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    networks:
      - logisense-net
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - logisense-net
    depends_on:
      - dashboard
      - backend
    restart: unless-stopped
